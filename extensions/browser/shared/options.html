<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>pad capture - Options</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      max-width: 400px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 20px 0;
      color: #4a90d9;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2a2a2a;
      color: #e0e0e0;
      font-size: 14px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #4a90d9;
    }
    .field {
      margin-bottom: 15px;
    }
    button {
      background: #4a90d9;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #3a7fc9;
    }
    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #28a745;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>pad capture</h1>

  <div class="field">
    <label for="wsUrl">Daemon WebSocket URL</label>
    <input type="text" id="wsUrl" placeholder="ws://localhost:7778">
    <div class="hint">Default: ws://localhost:7778</div>
  </div>

  <button id="save">Save</button>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
